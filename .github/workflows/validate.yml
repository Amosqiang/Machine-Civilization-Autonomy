name: Validate MCAB data and reports

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/run_pipeline.py
      - name: Ensure manual inputs were preserved
        run: git diff --exit-code -- data/taxonomy.csv data/metrics.csv data/dimensions.csv data/evidence_2026.csv data/dependencies.csv
