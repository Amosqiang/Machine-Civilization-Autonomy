name: Validate MCAB data and reports

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/edition_status.py --require-threshold-not-met
      - run: python3 scripts/validate_method.py
      - run: python3 scripts/run_pipeline.py
      - name: Ensure manual inputs were preserved
        run: git diff --exit-code -- data/ontology/taxonomy.csv data/ontology/metrics.csv data/ontology/dimensions.csv data/editions/2026/evidence.csv data/ontology/dependencies.csv data/editions/registry.csv data/threshold/STATUS.md data/method/source_playbooks.csv
